name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'mfinance v__VERSION__'
          releaseBody: 'Instalador y actualización automática de mfinance v__VERSION__.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ''

      # Tras publicar, la landing (GitHub Pages desde docs/) pasa a enlazar el
      # instalador nuevo. Es idempotente: si la versión no cambió, no hay commit.
      # El push con GITHUB_TOKEN no vuelve a disparar este workflow, pero sí
      # el despliegue de Pages.
      - name: Enlazar la nueva versión en la web
        shell: bash
        run: |
          node scripts/sync-web-version.mjs
          if git diff --quiet -- docs; then exit 0; fi
          version=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore(web): enlazar la descarga de v$version"
          git pull --rebase origin main
          git push origin HEAD:main
